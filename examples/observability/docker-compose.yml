# Local observability stack with synthetic traffic: Prometheus + Grafana + traffic generator.
# Synthetic data only; nothing is executed against a database. Ports bind to 127.0.0.1.
#
#   docker compose -f examples/observability/docker-compose.yml up -d --wait
#   open http://127.0.0.1:3000/d/sqlguard-ninja   (anonymous read-only viewer)
services:
  traffic:
    image: python:3.12-slim
    working_dir: /src
    volumes: ["../..:/src:ro"]
    command: >-
      sh -c "pip install --no-cache-dir --target /tmp/deps '/src[prometheus]' >/dev/null &&
      PYTHONPATH=/tmp/deps python /src/examples/observability/synthetic_traffic.py --host 0.0.0.0 --port 9464"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9464/metrics')"]
      interval: 5s
      retries: 60
    read_only: true
    tmpfs: ["/tmp:exec,mode=1777"]  # pip installs compiled wheels here
    user: "65534:65534"
    environment: {HOME: /tmp, PIP_CACHE_DIR: /tmp/pip}
  prometheus:
    image: prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: {traffic: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      retries: 30
  grafana:
    image: grafana/grafana:13.0.11@sha256:2abd2114bb65e4d6f0614206b7c882c1e7c6a992827ba08396aa5afc23ca07f5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/grafana:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {prometheus: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      retries: 30
