name: sqlguard-ninja-core
version: "1.2.0"
description: >
  Labelled SQL policy-enforcement cases for a synthetic multi-tenant retail schema.
  Expected outcomes follow the policy semantics in docs/guides/BENCHMARK_METHODOLOGY.md and
  are independent of any particular validator.
policy: ../../policies/retail_saas.yaml
default_context:
  tenant_id: 1
case_files:
  - cases/*.yaml
  - generated/*.yaml
generator:
  script: scripts/generate_corpus.py
  seed: 20261024
