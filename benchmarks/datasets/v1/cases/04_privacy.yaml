defaults:
  dialects: [postgres, sqlite]
  category: sensitive_field
  expected: deny
  classification: policy_violation
  reason: sensitive_data
cases:
  # ---- customer support vs payment data ----
  - id: PRV-001
    role: support_analyst
    sql: SELECT o.id, o.status, s.status AS shipment_status FROM orders o LEFT JOIN shipments s ON s.order_id = o.id AND s.tenant_id = 1 WHERE o.tenant_id = 1
    expected: allow
    reason: none
    explanation: Support may see order and shipment status.
  - id: PRV-002
    role: support_analyst
    sql: SELECT p.card_number FROM payments p WHERE p.tenant_id = 1
    explanation: Card numbers are payment_card data; denied for support.
  - id: PRV-003
    role: finance_analyst
    sql: SELECT p.card_number, p.amount FROM payments p WHERE p.tenant_id = 1
    explanation: Even finance may not see full card numbers.
  - id: PRV-004
    role: finance_analyst
    sql: SELECT p.card_last4, p.card_brand, p.amount FROM payments p WHERE p.tenant_id = 1
    expected: allow
    reason: none
    explanation: The less sensitive alternative to card_number.
  - id: PRV-005
    role: finance_analyst
    sql: SELECT p.iban, SUM(p.amount) FROM payments p WHERE p.tenant_id = 1 GROUP BY p.iban
    expected: allow
    reason: none
    explanation: Finance is allowed financial data, including IBAN.
  - id: PRV-006
    role: platform_admin
    sql: SELECT p.iban FROM payments p WHERE p.tenant_id = 1
    expected: review
    reason: sensitive_data
    explanation: Platform admins need human approval for financial data.
  - id: PRV-007
    role: platform_admin
    sql: SELECT p.card_number FROM payments p
    explanation: Card numbers are denied even for platform admins.

  # ---- HR: salary in aggregate only ----
  - id: PRV-010
    role: hr_analyst
    sql: SELECT department, AVG(salary) AS avg_salary FROM employees GROUP BY department
    expected: allow
    reason: none
    explanation: Statistical aggregate grouped by a non-identifying attribute.
  - id: PRV-011
    role: hr_analyst
    sql: SELECT department, COUNT(*), SUM(salary), MIN(hire_date) FROM employees GROUP BY department
    expected: allow
    reason: none
    explanation: SUM is statistical; MIN applies to an unrestricted column.
  - id: PRV-012
    role: hr_analyst
    sql: SELECT full_name, salary FROM employees
    reason: aggregate_only
    explanation: Individual salaries.
  - id: PRV-013
    role: hr_analyst
    sql: SELECT MAX(salary) FROM employees
    reason: aggregate_only
    explanation: MAX returns an individual value.
  - id: PRV-014
    role: hr_analyst
    sql: SELECT MIN(salary) FROM employees WHERE department = 'finance'
    reason: aggregate_only
    explanation: MIN returns an individual value.
  - id: PRV-015
    role: hr_analyst
    sql: SELECT department, SUM(salary) OVER (PARTITION BY id) AS s FROM employees
    reason: aggregate_only
    explanation: A window aggregate partitioned by id reproduces each salary.
  - id: PRV-016
    role: hr_analyst
    sql: SELECT id FROM employees WHERE salary > 100000
    reason: aggregate_only
    explanation: Filtering on salary reveals it by binary search.
  - id: PRV-017
    role: hr_analyst
    sql: SELECT full_name FROM employees ORDER BY salary DESC LIMIT 1
    reason: aggregate_only
    explanation: Ordering reveals the highest earner.
  - id: PRV-018
    role: hr_analyst
    sql: SELECT salary, COUNT(*) FROM employees GROUP BY salary
    reason: aggregate_only
    explanation: Grouping lists distinct salary values.
  - id: PRV-019
    role: hr_analyst
    sql: SELECT AVG(salary) FROM employees WHERE id = 7
    expected: review
    reason: small_cohort
    explanation: An average over one identified person equals that person's salary.
  - id: PRV-020
    role: hr_analyst
    sql: SELECT id, AVG(salary) FROM employees GROUP BY id
    expected: review
    reason: small_cohort
    explanation: Grouping by an identifier makes every group a single person, so each average is one salary.
  - id: PRV-021
    role: hr_analyst
    sql: SELECT department, COUNT(DISTINCT salary) FROM employees GROUP BY department
    expected: allow
    reason: none
    explanation: A count of distinct values is a statistic.
  - id: PRV-022
    role: hr_analyst
    sql: SELECT AVG(CASE WHEN department = 'support' THEN salary END) FROM employees
    expected: allow
    reason: none
    explanation: Conditional aggregate is still statistical.
  - id: PRV-023
    role: hr_analyst
    sql: SELECT national_id FROM employees
    reason: sensitive_data
    explanation: Government ids are denied for HR.
  - id: PRV-024
    role: hr_analyst
    sql: SELECT id FROM employees WHERE health_notes IS NOT NULL
    reason: sensitive_data
    explanation: Special-category data may not be referenced at all, even in a filter.
  - id: PRV-025
    role: hr_analyst
    sql: SELECT full_name, email, department, title FROM employees
    expected: allow
    reason: none
    explanation: HR may read names and contact details.
  - id: PRV-026
    role: hr_analyst
    sql: WITH s AS (SELECT department, salary FROM employees) SELECT department, AVG(salary) FROM s GROUP BY department
    expected: allow
    reason: none
    explanation: >-
      Lineage-aware semantics (since corpus 1.1.0): salary is projected raw inside the CTE, but
      its only consumer aggregates it with AVG, so only a statistic is revealed. Relabelled
      from deny; see benchmarks/datasets/v1/LABEL_CHANGES.yaml.
  - id: PRV-027
    role: hr_analyst
    sql: SELECT bank_account FROM employees
    reason: aggregate_only
    explanation: Financial data is aggregate-only for HR.

  # ---- warehouse vs HR ----
  - id: PRV-030
    role: warehouse_analyst
    sql: SELECT s.carrier, COUNT(*) FROM shipments s WHERE s.tenant_id = 1 GROUP BY s.carrier
    expected: allow
    reason: none
    explanation: Shipment statistics.
  - id: PRV-031
    role: warehouse_analyst
    sql: SELECT s.delivery_address FROM shipments s WHERE s.tenant_id = 1
    explanation: Delivery addresses are contact data, not in the warehouse labels.
  - id: PRV-032
    role: warehouse_analyst
    sql: SELECT COUNT(DISTINCT s.delivery_address) FROM shipments s WHERE s.tenant_id = 1
    explanation: Contact is denied (not aggregate-only) for warehouse; any reference is denied.

  # ---- reporting agent: minimisation ----
  - id: PRV-040
    role: reporting_agent
    sql: SELECT c.country, COUNT(*) FROM customers c WHERE c.tenant_id = 1 GROUP BY c.country
    expected: allow
    reason: none
    explanation: Country is unclassified.
  - id: PRV-041
    role: reporting_agent
    sql: SELECT c.city, COUNT(*) FROM customers c WHERE c.tenant_id = 1 GROUP BY c.city
    reason: aggregate_only
    explanation: City is location data, aggregate-only for the reporting agent; grouping lists values.
  - id: PRV-042
    role: reporting_agent
    sql: SELECT COUNT(DISTINCT c.city) FROM customers c WHERE c.tenant_id = 1
    expected: allow
    reason: none
    explanation: Counting distinct cities is a statistic.
  - id: PRV-043
    role: reporting_agent
    sql: SELECT c.email FROM customers c WHERE c.tenant_id = 1
    explanation: Email is granted as a column but contact data is denied for this role.
  - id: PRV-044
    role: reporting_agent
    sql: SELECT c.email_domain, COUNT(*) FROM customers c WHERE c.tenant_id = 1 GROUP BY c.email_domain
    expected: allow
    reason: none
    explanation: The minimised alternative to email.

  # ---- JSON fields ----
  - id: JSN-001
    role: support_analyst
    sql: SELECT c.profile->'preferences'->>'language' FROM customers c WHERE c.tenant_id = 1
    category: json_fields
    expected: allow
    reason: none
    explanation: Unclassified JSON path.
  - id: JSN-002
    role: support_analyst
    sql: SELECT c.profile->'health'->>'allergies' FROM customers c WHERE c.tenant_id = 1
    category: json_fields
    explanation: Special-category data inside JSON.
  - id: JSN-003
    role: support_analyst
    sql: SELECT c.profile->'payment'->>'card_number' FROM customers c WHERE c.tenant_id = 1
    category: json_fields
    explanation: Card number inside JSON.
  - id: JSN-004
    role: support_analyst
    sql: SELECT c.profile FROM customers c WHERE c.tenant_id = 1
    category: json_fields
    explanation: The whole document includes every nested classified field.
  - id: JSN-005
    role: support_analyst
    sql: SELECT c.profile->'health' FROM customers c WHERE c.tenant_id = 1
    category: json_fields
    explanation: A parent object includes its classified children.
  - id: JSN-006
    role: support_analyst
    sql: SELECT c.profile #>> '{health,allergies}' FROM customers c WHERE c.tenant_id = 1
    dialects: [postgres]
    category: json_fields
    explanation: Path-array operator form.
  - id: JSN-007
    role: support_analyst
    sql: SELECT json_extract(c.profile, '$.health.allergies') FROM customers c WHERE c.tenant_id = 1
    dialects: [sqlite]
    category: json_fields
    explanation: SQLite json_extract form.
  - id: JSN-008
    role: support_analyst
    sql: SELECT json_extract(c.profile, '$.preferences.newsletter') FROM customers c WHERE c.tenant_id = 1
    dialects: [sqlite]
    category: json_fields
    expected: allow
    reason: none
    explanation: Unclassified path, SQLite form.
  - id: JSN-009
    role: support_analyst
    sql: SELECT c.id FROM customers c WHERE c.tenant_id = 1 AND c.profile->'health'->>'allergies' = 'none'
    category: json_fields
    explanation: Filtering on special-category JSON data is still access.
