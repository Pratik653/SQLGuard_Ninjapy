name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for every job; no job uses repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint, types, corpus reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      - run: mypy
      - name: Generated corpus is up to date
        run: python scripts/generate_corpus.py --check
      - name: Dataset loads and validates
        run: sqlninja dataset stats --dataset benchmarks/datasets/v1

  test:
    name: Tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Unit, security, property and SQLite integration tests
        run: >-
          python -m pytest -q -m "not postgres and not mysql"
          --cov=sqlguard_ninja --cov-report=term --cov-report=xml --cov-fail-under=85
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  postgres:
    name: PostgreSQL integration (service container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway credential for an ephemeral CI container; not a secret.
          POSTGRES_PASSWORD: sqlninja-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      SQLNINJA_PG_DSN: postgresql://postgres:sqlninja-ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m postgres tests/integration/test_postgres.py
      - run: python examples/postgresql/plan_inspection_demo.py

  mysql:
    name: MySQL integration (service container)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # Throwaway credential for an ephemeral CI container; not a secret.
          MYSQL_ROOT_PASSWORD: sqlninja-ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psqlninja-ci" --health-interval 3s
          --health-timeout 3s --health-retries 40
    env:
      SQLNINJA_MYSQL_DSN: mysql://root:sqlninja-ci@127.0.0.1:3306/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m mysql tests/integration/test_mysql.py -rs

  docker-compose:
    name: Docker Compose environment
    runs-on: ubuntu-latest
    env:
      SQLNINJA_PG_DSN: postgresql://postgres:sqlninja-dev@localhost:55432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: docker compose -f docker/docker-compose.yml up -d --wait
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m postgres tests/integration/test_postgres.py
      - if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  sql-security-gate:
    name: SQL security regression gate (reusable action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dogfood the composite action from this checkout. For pull requests it reads the
      # approved baseline from the base branch, never from the pull request.
      - uses: ./
        with:
          config: sqlninja.yaml
          allow-benchmark-change: ${{ github.event_name == 'pull_request' }}

  external-adapters:
    name: Benchmark external validators (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/setup_external_adapters.py
      - name: Run each external validator
        run: |
          for tool in sql-guardrail agent-sql-guard krish2105-sqlguard; do
            sqlninja benchmark run --dataset benchmarks/datasets/v1 --adapter "external:$tool" \
              --output "results/$tool.json" --report "results/$tool.md" --summary
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-benchmarks
          path: results/

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/sqlninja --version
          /tmp/clean/bin/sqlninja init demo
          /tmp/clean/bin/sqlninja benchmark run --config demo/sqlninja.yaml
          /tmp/clean/bin/python -c "import sqlguard_ninja; print(sqlguard_ninja.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
