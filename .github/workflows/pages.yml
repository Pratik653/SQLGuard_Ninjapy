# Publishes the static, in-browser playground to GitHub Pages.
# Manual only: GitHub Pages must first be enabled for this repository (Settings > Pages >
# Source: GitHub Actions). The site is static; no server, secrets or credentials are involved.
name: Deploy playground to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" "pytest-playwright==0.10.0"
      - run: python scripts/build_static_demo.py site
      - run: python -m playwright install --with-deps chromium
      - name: Test the exact site that will be published
        run: SQLNINJA_STATIC_SITE=site python -m pytest -q -m e2e tests/e2e/test_static_demo_e2e.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
