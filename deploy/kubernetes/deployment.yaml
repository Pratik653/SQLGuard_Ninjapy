# Playground server. No Secrets, no database credentials, no service-account token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlguard-ninja-demo
  labels: {app.kubernetes.io/name: sqlguard-ninja-demo}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: sqlguard-ninja-demo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sqlguard-ninja-demo}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: demo
          # Replace with your registry and pin the digest you built and scanned.
          image: ghcr.io/example/sqlguard-ninja-demo:0.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          env:
            - {name: SQLNINJA_DEMO_EXECUTE, value: "true"}
            - {name: SQLNINJA_DEMO_RATE_LIMIT_PER_MINUTE, value: "60"}
            - {name: SQLNINJA_DEMO_TRUST_PROXY_HEADERS, value: "true"}  # only behind the ingress
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 64Mi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi, medium: Memory}
