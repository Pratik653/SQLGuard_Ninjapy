# Ingress only from the ingress controller's namespace; no egress at all (the demo needs none).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sqlguard-ninja-demo
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: sqlguard-ninja-demo}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {port: 8000, protocol: TCP}
  egress: []
